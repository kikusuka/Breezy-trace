[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breezy-trace"
version = "0.1.0"
description = "Local-first project memory and development intelligence for your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Breezy Labs" }]
keywords = [
  "git",
  "developer-tools",
  "project-memory",
  "terminal",
  "tui",
  "local-first",
  "productivity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "platformdirs>=4.0",
  "textual>=0.70",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.5", "ruff>=0.5", "build>=1.2", "twine>=5.0"]
code = ["tree-sitter-language-pack>=1.24,<2"]

[project.scripts]
breezy-trace = "breezy_trace.cli:main"
trace = "breezy_trace.cli:main"
btrace = "breezy_trace.cli:main"

[project.urls]
Homepage = "https://github.com/kikusuka/Breezy-trace"
Issues = "https://github.com/kikusuka/Breezy-trace/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
