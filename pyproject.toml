[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breezy-trace"
version = "0.1.1"
description = "Local-first project memory and development intelligence for your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Breezy Labs" }]
maintainers = [{ name = "Breezy Labs" }]
keywords = [
  "git",
  "developer-tools",
  "project-memory",
  "terminal",
  "tui",
  "local-first",
  "productivity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "platformdirs>=4.0,<5",
  "textual>=0.70,<9",
  "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.5", "ruff>=0.5", "build>=1.2", "twine>=5.0"]
code = ["tree-sitter-language-pack>=1.24,<2"]

[project.scripts]
breezy-trace = "breezy_trace.cli:main"
trace = "breezy_trace.cli:main"
btrace = "breezy_trace.cli:main"

[project.urls]
Homepage = "https://github.com/kikusuka/Breezy-trace"
Documentation = "https://github.com/kikusuka/Breezy-trace#readme"
Issues = "https://github.com/kikusuka/Breezy-trace/issues"
Changelog = "https://github.com/kikusuka/Breezy-trace/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP", "SIM", "C4", "PIE", "RUF100"]

[tool.coverage.run]
branch = true
source = ["breezy_trace"]

[tool.coverage.report]
show_missing = true
skip_covered = true
