name: CI

on:
  push:
    branches: ["main", "feat/**", "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install built wheel in a clean environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv .venv-wheel-test
          .venv-wheel-test/bin/python -m pip install dist/*.whl
          .venv-wheel-test/bin/breezy-trace --help
          .venv-wheel-test/bin/btrace --help
          .venv-wheel-test/bin/python -m breezy_trace --help
      - name: Install built wheel in a clean environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv-wheel-test
          .venv-wheel-test\Scripts\python.exe -m pip install (Get-ChildItem dist/*.whl).FullName
          .venv-wheel-test\Scripts\breezy-trace.exe --help
          .venv-wheel-test\Scripts\btrace.exe --help
          .venv-wheel-test\Scripts\python.exe -m breezy_trace --help
