name: binaries

on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/binaries.yml"
      - "src/breezy_trace/**"
      - "packaging/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build binaries for (for example v0.3.0)"
        required: true
        type: string

# Read-only by default. Only the upload job opts in to contents: write;
# pull request builds never receive write access and never upload anything.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025
            arch: x64
          - os: windows
            runner: windows-11-arm
            arch: arm64
          - os: macos
            runner: macos-15
            arch: arm64
          - os: macos
            runner: macos-15-intel
            arch: x64
          # Ubuntu 22.04 ships glibc 2.35. Building on the older image lets the
          # Linux programs run on more distributions than an Ubuntu 24.04 build.
          - os: linux
            runner: ubuntu-22.04
            arch: x64
          - os: linux
            runner: ubuntu-22.04-arm
            arch: arm64
    steps:
      - name: Check out the requested tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - name: Check out the published release tag
        if: github.event_name == 'release'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check out the pull request merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify the checked-out code has --self-test
        shell: bash
        run: |
          if ! git grep -q self-test -- src/breezy_trace/cli.py; then
            echo "::error::The checked-out code does not have the --self-test option."
            echo "::error::This tag predates the standalone self-test. Publish a tag that contains it before building binaries."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
          cache: pip

      - name: Install Breezy Trace and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Pinned to the exact PyInstaller version tested for these binaries.
          python -m pip install . pyinstaller==6.22.3

      - name: Generate third-party notices
        shell: bash
        run: python packaging/make_notices.py --output THIRD_PARTY_NOTICES.txt

      - name: Build standalone binary
        shell: bash
        run: |
          python -m PyInstaller \
            --name breezy-trace \
            --onedir \
            --noconfirm \
            --collect-all textual \
            --collect-submodules rich \
            --collect-submodules breezy_trace \
            --exclude-module tree_sitter \
            --exclude-module tree_sitter_language_pack \
            --distpath dist \
            --workpath build/breezy-trace \
            packaging/launcher.py

      - name: Smoke-test built binary (--version)
        shell: bash
        run: |
          BIN="dist/breezy-trace/breezy-trace"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version

      - name: Smoke-test built binary (--help)
        shell: bash
        run: |
          BIN="dist/breezy-trace/breezy-trace"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" --help > /dev/null

      - name: Smoke-test built binary (--self-test)
        shell: bash
        run: |
          BIN="dist/breezy-trace/breezy-trace"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          export BREEZY_TRACE_DATA_DIR="$RUNNER_TEMP/breezy-trace-self-test"
          "$BIN" --self-test

      - name: Package release archive
        shell: bash
        env:
          VERSION: "${{ github.event.release.tag_name || inputs.tag || '0.0.0-dev' }}"
          TARGET_OS: "${{ matrix.os }}"
          TARGET_ARCH: "${{ matrix.arch }}"
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          rm -rf staging release-assets
          mkdir -p staging release-assets
          cp -r dist/breezy-trace staging/breezy-trace
          cp LICENSE THIRD_PARTY_NOTICES.txt packaging/README-STANDALONE.txt staging/
          ASSET="breezy-trace-${VERSION}-${TARGET_OS}-${TARGET_ARCH}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import shutil; shutil.make_archive('release-assets/${ASSET}', 'zip', root_dir='staging')"
            test -f "release-assets/${ASSET}.zip"
          else
            tar -czf "release-assets/${ASSET}.tar.gz" -C staging .
            test -f "release-assets/${ASSET}.tar.gz"
          fi

      # Pull requests stop here: they build and smoke-test, but never upload.
      - name: Stage built archive
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breezy-trace-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  upload:
    name: Upload release assets
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Create SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum breezy-trace-*.zip breezy-trace-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/* --clobber
