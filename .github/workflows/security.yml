name: Dependency security

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Audit installed dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,code]" pip-audit
      - name: Audit dependency environment
        run: pip-audit --local
