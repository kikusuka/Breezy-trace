name: Installer smoke test

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/install-smoke.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/install-smoke.yml"
  schedule:
    # Weekly, Monday 06:17 UTC, so silent breakage in the published package or
    # the uv installer is noticed even when the scripts do not change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: sh
          - os: macos-latest
            script: sh
          - os: windows-latest
            script: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install with scripts/install.sh
        if: matrix.script == 'sh'
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-install
          UV_NO_MODIFY_PATH: "1"
          BREEZY_TRACE_DATA_DIR: ${{ runner.temp }}/trace-data
        run: |
          sh scripts/install.sh
          sh scripts/install.sh
          output=$("$UV_TOOL_BIN_DIR/breezy-trace" --version)
          printf '%s\n' "$output"
          case "$output" in
            "breezy-trace "*) ;;
            *) printf 'unexpected version output\n' >&2; exit 1 ;;
          esac

      - name: Install with scripts/install.ps1
        if: matrix.script == 'pwsh'
        shell: pwsh
        env:
          UV_TOOL_DIR: ${{ runner.temp }}\uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\uv-bin
          UV_CACHE_DIR: ${{ runner.temp }}\uv-cache
          UV_INSTALL_DIR: ${{ runner.temp }}\uv-install
          UV_NO_MODIFY_PATH: "1"
          BREEZY_TRACE_DATA_DIR: ${{ runner.temp }}\trace-data
        run: |
          ./scripts/install.ps1
          ./scripts/install.ps1
          $output = & (Join-Path $env:UV_TOOL_BIN_DIR "breezy-trace.exe") --version
          Write-Host $output
          if (-not $output.StartsWith("breezy-trace ")) {
              throw "Unexpected version output: $output"
          }
